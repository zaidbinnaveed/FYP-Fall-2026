name: CI

on:
  push:
    branches: ["phase/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  SEAWEEDFS_IMAGE: chrislusf/seaweedfs:4.54

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.filter.outputs.api }}
      inference: ${{ steps.filter.outputs.inference }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - '.github/workflows/**'
            api:
              - *shared
              - 'api/**'
              - 'infrastructure/**'
            inference:
              - *shared
              - 'inference/**'
            frontend:
              - *shared
              - 'frontend/**'
            ml:
              - *shared
              - 'ml_research/**'

  api:
    name: API - lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Architecture contracts (import-linter)
        run: uv run lint-imports
      - name: Start SeaweedFS for storage integration tests
        working-directory: .
        run: |
          docker run -d --name storage --hostname storage -p 127.0.0.1:8333:8333 \
            -e STORAGE_ACCESS_KEY_ID=ci-access-key -e STORAGE_SECRET_ACCESS_KEY=ci-secret-key \
            -v "$PWD/infrastructure/storage/entrypoint.sh:/opt/oscc/entrypoint.sh:ro" \
            --entrypoint /bin/sh "$SEAWEEDFS_IMAGE" /opt/oscc/entrypoint.sh
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8333/healthz >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs storage
          exit 1
      - name: Pytest (unit + storage integration)
        env:
          STORAGE_INTEGRATION_ENDPOINT_URL: http://127.0.0.1:8333
          INTEGRATION_STORAGE_ACCESS_KEY_ID: ci-access-key
          INTEGRATION_STORAGE_SECRET_ACCESS_KEY: ci-secret-key
        run: uv run pytest --cov=app --cov-report=term-missing

  inference:
    name: Inference - lint, types, tests
    needs: changes
    if: needs.changes.outputs.inference == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: inference
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: inference/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  frontend:
    name: Frontend - lint, types, tests, build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  ml:
    name: ML research - lint, types, tests, CPU smoke run
    needs: changes
    if: needs.changes.outputs.ml == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ml_research
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ml_research/uv.lock
      - name: Check the lockfile is up to date
        run: uv lock --check
      - name: Install pinned deps with CPU torch (lockfile stays platform-neutral)
        id: install
        run: |
          uv venv --python 3.11 .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          VIRTUAL_ENV="$PWD/.venv" bash scripts/install_pinned.sh --torch cpu --extra train --dev
      - name: Ruff lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .
      - name: Ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .
      - name: Mypy (strict)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy
      - name: Pytest (unit, protocol guard, models, smoke, pipeline, resume, determinism)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -v
      - name: "R0 acceptance: oscc-ml train --model resnet50 --smoke (5-minute limit)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          start=$(date +%s)
          oscc-ml train --model resnet50 --smoke --runs-dir "$RUNNER_TEMP/runs"
          echo "elapsed: $(( $(date +%s) - start )) s"
          run_dir=$(ls -d "$RUNNER_TEMP"/runs/*_resnet50_42)
          find "$run_dir" -type f | sort
          cat "$run_dir/environment.json"

  uni-scripts:
    name: University scripts (${{ matrix.os }}) - uni_setup + uni_check in CPU mode
    needs: changes
    if: needs.changes.outputs.ml == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ml_research/uv.lock
      - name: ShellCheck the bash scripts
        if: runner.os == 'Linux'
        run: shellcheck ml_research/scripts/*.sh
      - name: uni_setup.sh --cpu
        if: runner.os == 'Linux'
        run: bash ml_research/scripts/uni_setup.sh --cpu
      - name: uni_check.sh (CPU, no downloads)
        if: runner.os == 'Linux'
        run: bash ml_research/scripts/uni_check.sh --allow-cpu --skip-download --min-free-gb 1 --budget-seconds 20 --batch-size 2
      - name: uni_setup.ps1 -Cpu (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ml_research/scripts/uni_setup.ps1 -Cpu
      - name: uni_check.ps1 (CPU, no downloads)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File ml_research/scripts/uni_check.ps1 -AllowCpu -SkipDownload -MinFreeGb 1 -BudgetSeconds 20 -BatchSize 2
      - name: uni_run.sh on a synthetic Kaggle-like zip, twice (second run must skip)
        if: runner.os == 'Linux'
        run: |
          ml_research/.venv/bin/oscc-ml make-test-zip --out "$RUNNER_TEMP/test.zip" --per-class 24 --augmented 1 --size 300x260
          ARGS=(--foreground --data-root ml_research/data/processed/synthetic-ci --dataset-version synthetic-ci
                --device cpu --random-init --sweep-epochs 1 --epochs 1 --bootstrap 50 --latency-warmup 1 --latency-runs 2)
          bash ml_research/scripts/uni_run.sh "$RUNNER_TEMP/test.zip" "${ARGS[@]}" && exit 1 || true  # report must refuse
          LOG=ml_research/runs/uni_run.log
          for line in "prepare +DONE" "sweep +DONE" "train-all +DONE" "evaluate +DONE" "report +FAILED" "pack-results +DONE"; do
            grep -Eq "$line" "$LOG" || { echo "missing in summary: $line"; exit 1; }
          done
          grep -q "synthetic" "$LOG"
          bash ml_research/scripts/uni_run.sh "$RUNNER_TEMP/test.zip" "${ARGS[@]}" || true
          grep -Eq "prepare +SKIPPED" "$LOG" && grep -Eq "sweep +SKIPPED" "$LOG"
      - name: uni_run.ps1 on a synthetic Kaggle-like zip, twice (second run must skip)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "test.zip"
          & ml_research\.venv\Scripts\oscc-ml.exe make-test-zip --out $zip --per-class 24 --augmented 1 --size 300x260
          $extra = @("--data-root", "ml_research/data/processed/synthetic-ci", "--dataset-version", "synthetic-ci",
                     "--device", "cpu", "--random-init", "--sweep-epochs", "1", "--epochs", "1",
                     "--bootstrap", "50", "--latency-warmup", "1", "--latency-runs", "2")
          & .\ml_research\scripts\uni_run.ps1 -Raw $zip -Foreground -ExtraArgs $extra
          if ($LASTEXITCODE -eq 0) { Write-Host "report should have been refused"; exit 1 }
          $log = "ml_research\runs\uni_run.log"
          foreach ($line in @("prepare +DONE", "sweep +DONE", "train-all +DONE", "evaluate +DONE", "report +FAILED", "pack-results +DONE")) {
            if (-not (Select-String -Path $log -Pattern $line -Quiet)) { Write-Host "missing in summary: $line"; exit 1 }
          }
          & .\ml_research\scripts\uni_run.ps1 -Raw $zip -Foreground -ExtraArgs $extra
          if (-not (Select-String -Path $log -Pattern "prepare +SKIPPED" -Quiet)) { Write-Host "prepare was not skipped"; exit 1 }
          if (-not (Select-String -Path $log -Pattern "sweep +SKIPPED" -Quiet)) { Write-Host "sweep was not skipped"; exit 1 }
          exit 0
      - name: Show uni_check.log and uni_run.log
        if: always()
        shell: bash
        run: |
          cat ml_research/runs/uni_check.log || true
          tail -n 60 ml_research/runs/uni_run.log || true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full history
        run: gitleaks git --redact --verbose --exit-code 1 .

  compose:
    name: Dev stack - all services healthy
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Create dev .env from the example
        run: cp infrastructure/.env.example infrastructure/.env
      - name: Build and start the stack
        run: docker compose -f infrastructure/docker-compose.dev.yml up --build --detach --wait --wait-timeout 600
      - name: Check every service is healthy
        run: bash infrastructure/scripts/compose_check.sh
      - name: Show service state and logs
        if: always()
        run: |
          docker compose -f infrastructure/docker-compose.dev.yml ps
          docker compose -f infrastructure/docker-compose.dev.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f infrastructure/docker-compose.dev.yml down --volumes

  ci-ok:
    name: CI result
    if: always()
    needs: [api, inference, frontend, ml, uni-scripts, secrets, compose]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then exit 1; fi
          done
