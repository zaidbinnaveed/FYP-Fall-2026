version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: uv
    directories: [/api, /inference, /ml_research]
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directories: [/api, /inference, /frontend]
    schedule:
      interval: monthly
    ignore:
      # The project is pinned to Python 3.11 (CLAUDE.md §5): only 3.11.x patch updates are proposed.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
