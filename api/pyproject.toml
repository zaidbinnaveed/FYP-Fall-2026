[project]
name = "oscc-api"
version = "0.1.0"
description = "OSCC Health Intelligence - public REST API, worker and admin CLI"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "boto3>=1.35",
    "typer>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "boto3-stubs[s3]>=1.35",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["app.db.migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real S3-compatible server (set STORAGE_INTEGRATION_ENDPOINT_URL)",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api never imports the ML stack (CLAUDE.md: api never imports torch)"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["torch", "torchvision", "transformers", "timm", "oscc_ml"]

[[tool.importlinter.contracts]]
name = "Only repositories and the db package touch SQL"
type = "forbidden"
source_modules = [
    "app.routers",
    "app.services",
    "app.guardrails",
    "app.schemas",
    "app.adapters",
    "app.worker",
    "app.core",
]
forbidden_modules = ["sqlalchemy", "asyncpg"]
# Direct imports only: services and the worker may call repositories, which use SQL.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Providers (storage SDK) are reached only through adapters"
type = "forbidden"
source_modules = [
    "app.routers",
    "app.services",
    "app.guardrails",
    "app.schemas",
    "app.repositories",
    "app.worker",
    "app.core",
    "app.db",
]
forbidden_modules = ["boto3", "botocore"]
allow_indirect_imports = true
