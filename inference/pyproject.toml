[project]
name = "oscc-inference"
version = "0.1.0"
description = "OSCC Health Intelligence - internal stateless inference service"
requires-python = ">=3.11,<3.12"
# D0: HTTP skeleton only. The ML stack (oscc_ml[preprocess], torch) is added in Phase D2.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["inference_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.importlinter]
root_package = "inference_service"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Inference is stateless: no database access and no dependency on the api package"
type = "forbidden"
source_modules = ["inference_service"]
forbidden_modules = ["sqlalchemy", "asyncpg", "psycopg", "app"]
